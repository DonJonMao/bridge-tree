seed: 42
retrieval:
  initial_width: 12
  branch_width: 8
  context_size: 5
  search_budget: 64
  max_ann_calls: null
  max_candidate_exposure: null
  max_depth: 2
  cluster_mode: fixed
  cluster_count: 4
  max_clusters: 8
  min_cluster_size: 1
  search_order: best_first
  feature_mode: rho
  selection_mode: rho_logdet
  stop_mode: budget
  diagnostic_level: light
  root_anchor_weight: 0.0
  index_backend: exact
  tie_tolerance: 1.0e-12
models:
  embedding:
    backend: remote
    endpoint: http://111.19.156.74:8001/v1/embeddings
    model: qwen3-embedding-8b
    query_instruction: "Instruct: Given a web search query, retrieve relevant passages that answer the query\nQuery: "
    batch_size: 32
    timeout_seconds: 60
  reranker:
    endpoint: http://111.19.156.74:8002/rerank
    model: ""
    timeout_seconds: 60
  generator:
    endpoint: http://111.19.156.30:8006/v1/chat/completions
    model: deepseek-v4-flash
    api_key: Aa@11111
    api_key_env: BRIDGETREE_CHAT_API_KEY
    timeout_seconds: 120
    temperature: 0.0
    max_tokens: 512
    context_token_budget: 8192
data:
  raw_dir: data/raw/personamem-v1
  processed_dir: data/processed/personamem-v1
  split: 32k
  include_system_persona: true
  memory_granularity: user_assistant_pair
runtime:
  device: cpu
  cache_dir: outputs/cache
  output_dir: outputs/runs
