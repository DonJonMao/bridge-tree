seed: 42
retrieval:
  profile: semantic_path_v1
  proposal_mode: real_member_query_anchor
  relation_mode: angular
  quality_mode: frozen_reranker
  path_mode: posterior_expected_scatter
  certificate_mode: "off"
  certificate_domain: frozen_pool
  context_unit: memory
  quality_score_space: unit_interval
  initial_width: 12
  branch_width: 8
  context_size: 5
  search_budget: 64
  max_ann_calls: null
  max_candidate_exposure: null
  max_depth: 2
  cluster_mode: fixed
  cluster_count: 4
  max_clusters: 8
  min_cluster_size: 1
  search_order: best_first
  feature_mode: cached_memory
  selection_mode: semantic_path_logdet
  stop_mode: budget
  diagnostic_level: light
  root_anchor_weight: 0.0
  index_backend: exact
  tie_tolerance: 1.0e-12
  temporal_measure: false
  measure_propagation: false
  state_information: false
  information_certificate: false
  state_basis_mode: option_contrast
  representation_mode: cached_memory
  score_contract: unit_interval
models:
  embedding:
    backend: remote
    endpoint: http://111.19.156.74:8001/v1/embeddings
    model: qwen3-embedding-8b
    query_instruction: "Instruct: Retrieve past personal interactions that help answer the current request\nQuery: "
    batch_size: 32
    timeout_seconds: 60
  reranker:
    endpoint: http://111.19.156.74:8002/rerank
    model: ""
    timeout_seconds: 60
    cache_dir: outputs/rerank_cache
  generator:
    endpoint: http://111.19.156.30:8006/v1/chat/completions
    model: deepseek-v4-flash
    # Automatically uses credentials.local.yaml beside this file when present.
    # BRIDGETREE_CHAT_API_KEY is an optional override, not a requirement.
    api_key: ""
    api_key_env: BRIDGETREE_CHAT_API_KEY
    timeout_seconds: 120
    temperature: 0.0
    max_tokens: 512
    context_token_budget: 8192
bridge_rerank:
  dense_pool_width: 20
  anchor_width: 12
  expand_branch_count: 2
  branch_overfetch_width: 8
  branch_keep_width: 4
  probe_mode: query_anchor
  path_filter: true
  use_answer_options: true
  include_time_metadata: true
  bridge_query_instruction: "Instruct: Retrieve a distinct past personal interaction that complements an anchor for answering the current request\nQuery: "
  final_rerank_instruction: "Rank past user interactions by how useful they are for selecting the best personalized answer. Prioritize explicit user preferences, constraints, experiences, and the latest state when preferences evolve. A passage that is merely topically related but cannot distinguish the answer choices should rank low."
  path_filter_instruction: "Rank candidate interactions by whether they add distinct, independently usable personal evidence beyond the anchor for answering the current request. Avoid anchor paraphrases and merely topical passages."
data:
  raw_dir: data/raw/personamem-v1
  processed_dir: data/processed/personamem-v1
  split: 32k
  include_system_persona: true
  memory_granularity: user_assistant_pair
runtime:
  device: cpu
  cache_dir: outputs/cache
  output_dir: outputs/runs
