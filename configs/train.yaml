# Full PersonaMem-v1 32K retrieval-configuration tuning.
# This is training-free hyperparameter selection: no model weights are updated.
seed: 42

# Split by persona so no identity leaks across selection and final evaluation.
split:
  train_ratio: 0.70
  validation_ratio: 0.15
  test_ratio: 0.15

# Null means the complete persona-disjoint validation/test partition is used.
# The train partition is reserved and never traversed because a fixed trial has
# no parameter update that could learn from a train pass.
schedule:
  max_validation_queries: null
  max_test_queries: null

# Budgets below the depth-2 expansion ceiling make Best-first ordering
# observable instead of allowing every first-level branch to expand.
search_space:
  initial_width: [8, 12]
  branch_width: [4, 8]
  search_budget: [20, 28, 36, 44]

# Search only the complete BridgeTree method. Module ablations are run later by
# scripts/ablation.sh and must not multiply every tuning trial.
diagnostic_methods:
  - bridgetree

# All methods use the same selected config, test questions, generator, prompt,
# final context size, and context/output token budgets.
main_table_methods:
  - dense
  - dense_rerank
  - rfmem_familiarity
  - rfmem_recollection
  - rfmem
  - cluster_prf
  - bridgetree

# PersonaMem has no official memory-ID gold, so generated answer accuracy is
# the independent validation objective. A single failed query aborts the run.
objective_metric: outcome.answer_accuracy
objective_mode: max
bridge_gold_path: null
validation_generate: true
final_generate: true
fail_on_evaluation_error: true
keep_example_metrics: true
output_dir: outputs/tuning-32k
