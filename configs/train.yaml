# "Training" is a training-free search over retrieval configurations. It never
# updates embedding or generator model weights.
seed: 42

# Personas, rather than individual questions, are split to prevent leakage.
split:
  train_ratio: 0.70
  validation_ratio: 0.15
  test_ratio: 0.15

schedule:
  periodic_eval_every: 50
  periodic_eval_queries: 8
  max_train_queries: null
  max_validation_queries: null
  max_test_queries: null

search_space:
  initial_width: [8, 12]
  branch_width: [4, 8]
  search_budget: [64]

# BridgeTree plus one isolated ablation for every algorithmic module.
diagnostic_methods:
  - bridgetree
  - ablation_no_cluster
  - ablation_bfs
  - ablation_fixed_depth
  - ablation_topk
  - ablation_rho_dpp
  - ablation_direct_path

# Main-table methods all use the same segmentation, k, prompt, generator and
# token budget on final test after an externally justified selection exists.
main_table_methods:
  - dense
  - dense_rerank
  - rfmem_familiarity
  - rfmem_recollection
  - rfmem
  - cluster_prf
  - bridgetree

# auto resolves to validation answer accuracy when validation_generate=true,
# independent recall when bridge_gold_path is set, and no selection otherwise.
objective_metric: auto
objective_mode: max
bridge_gold_path: null
validation_generate: false
final_generate: false
keep_example_metrics: true
output_dir: outputs/training
